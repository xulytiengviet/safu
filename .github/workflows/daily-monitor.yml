name: Daily source monitoring
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safu-source-monitor
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public-source availability (non-verifying)
        run: python scripts/check_sources.py
      - name: Store daily evidence-access checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily public-source availability checkpoint"
            git push
          fi
